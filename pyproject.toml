[project]
name = "proxy-toolbox"
version = "2.2.0"
description = "MTG Proxy Toolbox — Download, layout, and print Magic: The Gathering card proxies"
requires-python = ">=3.11"
dependencies = [
    "cffi>=1.17",
    "pywebview>=5.0",
    "httpx>=0.27",
    "pydantic>=2.0",
    "reportlab>=4.0",
    "Pillow>=10.0",
]

[project.optional-dependencies]
dev = ["pytest", "ruff"]

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.pytest.ini_options]
testpaths = ["tests"]
